name: Sync Genshin Plugin

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点执行
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: current-repo

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: yoimiya-kokomi/Miao-Yunzai
          path: source-repo
          ref: master
          sparse-checkout: |
            plugins/genshin

      - name: Get upstream commit info
        run: |
          cd source-repo
          echo "UPSTREAM_MSG=$(git log -1 --pretty=format:'%s' -- plugins/genshin)" >> $GITHUB_ENV
          echo "UPSTREAM_HASH=$(git log -1 --pretty=format:'%H' -- plugins/genshin)" >> $GITHUB_ENV
        shell: bash

      - name: Sync genshin plugin files, exclude workflow
        run: |
          rsync -av --exclude='.github/workflows/sync-genshin.yml' source-repo/plugins/genshin/ current-repo/
        shell: bash

      - name: Commit changes
        run: |
          cd current-repo
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit \
              -m "${{ env.UPSTREAM_MSG }}" \
              -m "upstream: yoimiya-kokomi/Miao-Yunzai@${{ env.UPSTREAM_HASH }}"
            git push
          else
            echo "No changes to commit"
          fi
        shell: bash
